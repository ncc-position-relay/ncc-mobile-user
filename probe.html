<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NCC Mobile Probe</title>
  <style>
    body{margin:0;padding:24px;background:#081923;color:#fff;font-family:Tahoma,Arial,sans-serif}
    .box{max-width:680px;margin:auto;background:#102c3d;border:1px solid #31596e;border-radius:14px;padding:18px}
    .ok{color:#65e39a}
    code{direction:ltr;display:block;background:#05121a;padding:10px;border-radius:8px;margin-top:8px}
  </style>
</head>
<body>
  <div class="box">
    <h1>NCC MOBILE PROBE</h1>
    <p class="ok">STATIC HTML: OK</p>
    <p id="js">JAVASCRIPT: NOT RUN YET</p>
    <code id="ua"></code>
  </div>

  <script>
    document.getElementById('js').textContent = 'JAVASCRIPT: OK';
    document.getElementById('js').className = 'ok';
    document.getElementById('ua').textContent = navigator.userAgent;
  </script>
</body>
</html>
